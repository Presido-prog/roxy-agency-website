# Pages CMS config for Roxy Agency.
# Repo root should be this folder (the one that contains ).
# Pride edits at https://app.pagescms.org after connecting GitHub.
# Docs: https://pagescms.org/docs/configuration/

media:
  - name: images
    label: Photos
    input: assets/uploads
    output: assets/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe
  - name: videos
    label: Videos
    input: assets/video
    output: assets/video
    categories: [video]
    extensions: [mp4, webm]
    rename: safe

content:
  - name: start
    label: Start here
    type: group
    items:
      - name: settings
        label: Site name & contact
        type: file
        path: content/settings.json
        format: json
        fields:
          - name: siteName
            label: Agency name
            type: string
            required: true
          - name: siteShortName
            label: Short name (e.g. Roxy BC)
            type: string
          - name: logoLetter
            label: Logo letter
            type: string
          - name: logoTagline
            label: Logo line under the name
            type: string
          - name: title
            label: Browser tab title
            type: string
          - name: description
            label: Short site description
            type: text
          - name: ogTitle
            label: Share title (WhatsApp / Facebook)
            type: string
          - name: ogDescription
            label: Share description
            type: text
          - name: ogImage
            label: Share image
            type: image
            options:
              media: images
          - name: publicUrl
            label: Public website address (no slash at the end)
            type: string
            description: Now this is the flypod preview. Later change it to https://presidoagencyroxy.com
          - name: whatsappDisplay
            label: WhatsApp number as you want it shown
            type: string
            required: true
            description: Example 0706 504 6266
          - name: whatsappInternational
            label: International number shown under it
            type: string
            description: Example +234 706 504 6266
          - name: whatsappNumber
            label: WhatsApp digits only (for the chat button)
            type: string
            required: true
            description: Example 07065046266 or 2347065046266
          - name: email
            label: Email
            type: string
          - name: inviteUrl
            label: BIGO invite link
            type: string
          - name: searchTerm
            label: What people should search in BIGO
            type: string
            description: Usually presido
          - name: qrImage
            label: WhatsApp QR code image
            type: image
            options:
              media: images
            description: If you change the WhatsApp number, upload a new QR or leave this blank and the site will generate one.
          - name: headerCta
            label: Header button text
            type: string
          - name: shareTitle
            label: Title when someone taps Share
            type: string
          - name: shareText
            label: Message when someone taps Share
            type: text
          - name: legal
            label: Footer legal text
            type: text
            description: Please keep the 18+ line and the note that Roxy is not BIGO itself.
          - name: footerExtra
            label: Footer contact line
            type: text
            description: You can use {whatsapp}, {email} and {search}. **bold** works.

      - name: hero
        label: Homepage headline
        type: file
        path: content/hero.json
        format: json
        fields:
          - name: eyebrow
            label: Small line above the headline
            type: string
          - name: headline
            label: Headline
            type: string
            required: true
          - name: headlineAccent
            label: Gold highlighted line
            type: string
          - name: lead
            label: Welcome paragraph
            type: text
          - name: chips
            label: Small tags under the welcome
            type: string
            list: true
          - name: finePrint
            label: Small line under the buttons
            type: string
          - name: primaryCta
            label: Green WhatsApp button
            type: string
          - name: secondaryCta
            label: Download button
            type: string
          - name: tertiaryCta
            label: Apply button
            type: string
          - name: asideImage
            label: Photo on the right (desktop)
            type: image
            options:
              media: images
          - name: asideAlt
            label: Description of that photo (for accessibility)
            type: string
          - name: backgroundImage
            label: Background photo behind the headline
            type: image
            options:
              media: images

  - name: join_group
    label: Join & Academy
    type: group
    items:
      - name: join
        label: How to join
        type: file
        path: content/join.json
        format: json
        fields:
          - name: downloadKicker
            label: Download section label
            type: string
          - name: downloadTitle
            label: Download heading
            type: string
          - name: downloadSub
            label: Download intro
            type: text
          - name: stores
            label: Official download links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                type: string
                required: true
              - name: note
                type: string
              - name: url
                label: Link
                type: string
              - name: icon
                label: Icon letter
                type: string
          - name: kicker
            label: Join section label
            type: string
          - name: title
            label: Join heading
            type: string
          - name: sub
            label: Join intro
            type: text
          - name: steps
            label: Steps
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}{divider}"
            fields:
              - name: divider
                label: Divider text instead of a step (optional)
                type: string
                description: Example OR USE OUR INVITE LINK. Leave blank for a normal step.
              - name: title
                type: string
              - name: text
                type: text
                description: **bold**, *italic*, and [link text]({invite}) are ok.
          - name: warning
            label: Important warning box
            type: text
          - name: inviteButton
            label: Invite button text
            type: string
          - name: whatsappButton
            label: WhatsApp button text
            type: string

      - name: academy
        label: Academy cards
        type: file
        path: content/academy.json
        format: json
        fields:
          - name: kicker
            type: string
          - name: title
            type: string
          - name: sub
            label: Intro
            type: text
          - name: cards
            label: Cards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: icon
                label: Emoji icon
                type: string
              - name: title
                type: string
                required: true
              - name: open
                label: Open this card when the page loads
                type: boolean
                default: false
              - name: text
                label: Paragraph
                type: text
              - name: bullets
                label: Bullet points
                type: string
                list: true

  - name: pay
    label: Salary & referral
    type: group
    items:
      - name: salary
        label: Salary table
        type: file
        path: content/salary.json
        format: json
        fields:
          - name: title
            type: string
          - name: intro
            label: Text above the table
            type: text
          - name: rows
            label: Salary rows
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{rank} — {salary}"
            fields:
              - name: rank
                type: string
                required: true
              - name: beans
                label: Bean target
                type: string
              - name: hours
                label: Live hours
                type: string
              - name: salary
                label: Host salary
                type: string
          - name: note
            label: Note under the table
            type: text
          - name: payoutTitle
            label: Real payouts heading
            type: string
          - name: payoutText
            label: Real payouts text
            type: text

      - name: referral
        label: Invite & earn
        type: file
        path: content/referral.json
        format: json
        fields:
          - name: kicker
            type: string
          - name: title
            type: string
          - name: sub
            type: text
          - name: tiers
            label: Commission amounts
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{label} — {amount}"
            fields:
              - name: label
                type: string
              - name: amount
                type: string
          - name: body
            label: Text under the amounts
            type: text
          - name: button
            label: Button text
            type: string
          - name: buttonMessage
            label: Pre-filled WhatsApp message
            type: string

  - name: media
    label: Videos, events & photos
    type: group
    items:
      - name: videos
        label: Videos
        type: file
        path: content/videos.json
        format: json
        fields:
          - name: kicker
            type: string
          - name: title
            type: string
          - name: sub
            type: text
          - name: items
            label: Videos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                type: string
                required: true
              - name: caption
                type: text
              - name: src
                label: Video file
                type: file
                options:
                  media: videos
                  categories: [video]
                  extensions: [mp4, webm]
                description: Keep each video under 8 MB so the site stays fast on cheap phones.
              - name: poster
                label: Preview image
                type: image
                options:
                  media: images

      - name: events
        label: Events
        type: file
        path: content/events.json
        format: json
        fields:
          - name: kicker
            type: string
          - name: title
            type: string
          - name: sub
            type: text
          - name: items
            label: Event cards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                type: string
                required: true
              - name: date
                label: Date (optional)
                type: date
                default: ""
                options:
                  format: yyyy-MM-dd
              - name: image
                type: image
                options:
                  media: images
              - name: imageAlt
                label: Photo description
                type: string
              - name: text
                type: text
              - name: published
                label: Show on the website
                type: boolean
                default: true

      - name: gallery
        label: Photo gallery
        type: file
        path: content/gallery.json
        format: json
        fields:
          - name: kicker
            type: string
          - name: title
            type: string
          - name: sub
            type: text
          - name: photos
            label: Photos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - name: image
                type: image
                required: true
                options:
                  media: images
              - name: alt
                label: Photo description
                type: string
              - name: caption
                label: Caption
                type: string

  - name: people
    label: Stories, about & contact
    type: group
    items:
      - name: stories
        label: Host stories
        type: file
        path: content/stories.json
        format: json
        fields:
          - name: kicker
            type: string
          - name: title
            type: string
          - name: placeholder
            label: Text when there are no stories yet
            type: text
            description: We do not invent testimonials. Only add a story with the host’s permission.
          - name: button
            label: Button text
            type: string
          - name: buttonMessage
            label: Pre-filled WhatsApp message
            type: string
          - name: items
            label: Real host stories
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                type: string
              - name: quote
                type: text
              - name: photo
                type: image
                options:
                  media: images
              - name: published
                label: Show on the website
                type: boolean
                default: true

      - name: about
        label: About
        type: file
        path: content/about.json
        format: json
        fields:
          - name: kicker
            type: string
          - name: title
            type: string
          - name: paragraphs
            label: About paragraphs
            type: text
            list: true
          - name: button
            label: WhatsApp button
            type: string
          - name: photo
            label: Optional photo
            type: image
            options:
              media: images
          - name: photoAlt
            label: Photo description
            type: string
          - name: whyTitle
            label: Side box heading
            type: string
          - name: whyBullets
            label: Why Roxy points
            type: string
            list: true

      - name: contact
        label: Contact section text
        type: file
        path: content/contact.json
        format: json
        fields:
          - name: kicker
            type: string
          - name: title
            type: string
          - name: note
            type: text
          - name: whatsappButton
            type: string
          - name: shareButton
            type: string
          - name: qrCaption
            type: string
